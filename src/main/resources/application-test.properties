# Automated test profile. Tests never call OpenAI: the key is forced empty,
# so the real assistant is not created and tests use a mock instead.

spring.thymeleaf.cache=false

langchain.openai.api-key=
langchain.openai.model-name=gpt-5-mini
langchain.openai.max-completion-tokens=256
langchain.openai.log-requests=false
