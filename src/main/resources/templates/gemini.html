<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${title})}"></head>
<body>
<header th:replace="~{layout :: header}"></header>

<main class="container">
    <h1 th:text="${title}">Gemini Chat</h1>

    <p th:unless="${enabled}" class="notice">
        Gemini is disabled. Set the <code>GEMINI_API_KEY</code> environment variable and restart.
    </p>
    <p th:if="${error}" class="notice" th:text="${error}">Error</p>

    <form th:if="${enabled}" th:action="@{/gemini}" method="post" class="ask-form">
        <label for="question">Ask Google Gemini anything</label>
        <textarea id="question" name="question" rows="3" required
                  th:text="${question}">Explain how AI works in a few words</textarea>
        <button type="submit">Ask</button>
    </form>

    <section th:if="${answer}" class="answer">
        <h2>Answer</h2>
        <p th:text="${answer}">Answer text</p>
    </section>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
