# Production profile. Run: SPRING_PROFILES_ACTIVE=prod java -jar target/election-solution-0.0.1-SNAPSHOT.jar

server.port=${PORT:8080}
spring.thymeleaf.cache=true

# API key must be supplied by the environment / secret manager - never commit it.
langchain.openai.api-key=${OPENAI_API_KEY:}
langchain.openai.model-name=${OPENAI_MODEL:gpt-5-mini}
langchain.openai.max-completion-tokens=1024

# Do not log prompts or answers in production
langchain.openai.log-requests=false
logging.level.root=INFO
logging.level.dev.langchain4j=WARN
