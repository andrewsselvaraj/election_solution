spring.application.name=election-solution
server.port=8080

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# LangChain4j sample (Anthropic Claude). The assistant is disabled when no API key is set.
langchain.anthropic.api-key=${ANTHROPIC_API_KEY:}
langchain.anthropic.model-name=claude-sonnet-5
langchain.anthropic.max-tokens=1024
