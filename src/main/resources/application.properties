spring.application.name=election-solution
server.port=8080

# Local runs use only this file. Other profiles are opt-in, e.g. SPRING_PROFILES_ACTIVE=prod.

# Resume upload size limit
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# LangChain4j sample (OpenAI). The assistant is disabled when no API key is set.
# Never put a real key in these files: it is read from the OPENAI_API_KEY environment variable.
langchain.openai.api-key=${OPENAI_API_KEY:}
langchain.openai.model-name=gpt-5-mini
langchain.openai.max-completion-tokens=1024
langchain.openai.embedding-model-name=text-embedding-3-small
langchain.openai.log-requests=false

# Google Gemini (LangChain4j). The Gemini page is disabled when no key is set.
# Never put a real key here: it is read from the GEMINI_API_KEY environment variable.
langchain.gemini.api-key=${GEMINI_API_KEY:}
langchain.gemini.model-name=gemini-flash-latest
langchain.gemini.max-output-tokens=1024
langchain.gemini.log-requests=false
