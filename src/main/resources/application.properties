spring.application.name=election-solution
server.port=8080

# Local runs use only this file. Other profiles are opt-in, e.g. SPRING_PROFILES_ACTIVE=prod.

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# LangChain4j sample (OpenAI). The assistant is disabled when no API key is set.
# Never put a real key in these files: it is read from the OPENAI_API_KEY environment variable.
langchain.openai.api-key=${OPENAI_API_KEY:}
langchain.openai.model-name=gpt-5-mini
langchain.openai.max-completion-tokens=1024
langchain.openai.log-requests=false
