# Local development profile (default). Run: ./mvnw spring-boot:run

# Reload templates without restarting
spring.thymeleaf.cache=false

# API key comes from the environment only - do not paste a real key here.
langchain.openai.api-key=${OPENAI_API_KEY:}
langchain.openai.model-name=gpt-5-mini
langchain.openai.max-completion-tokens=1024

# Print the messages and tool calls sent to / received from OpenAI
langchain.openai.log-requests=true
logging.level.dev.langchain4j=DEBUG
logging.level.com.election.solution=DEBUG
