<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vector DB Demo</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #222; }
        form { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
        input, select, button { font: inherit; padding: .4rem .6rem; }
        input[type=text] { flex: 1; min-width: 200px; }
        .result { border: 1px solid #ddd; border-radius: 6px; padding: .6rem .8rem; margin-bottom: .5rem; }
        .meta { color: #666; font-size: .85rem; }
        h2 { margin-top: 2rem; }
    </style>
</head>
<body>
<h1>Vector DB Demo</h1>
<p>Search finds documents by <em>meaning</em>, not exact words. Try "fast animal", "what is pgvector" or "Japanese food".</p>

<form id="search-form">
    <input type="text" id="q" placeholder="Search query" required>
    <input type="text" id="category" placeholder="Category (optional)" size="12">
    <input type="number" id="k" value="3" min="1" max="50" title="Max results" style="width:4rem">
    <button type="submit">Search</button>
</form>
<div id="results"></div>

<h2>Add a document</h2>
<form id="add-form">
    <input type="text" id="text" placeholder="Document text" required>
    <input type="text" id="new-category" placeholder="Category" size="12">
    <button type="submit">Add</button>
</form>
<div id="add-status" class="meta"></div>

<script>
    const results = document.getElementById('results');

    document.getElementById('search-form').addEventListener('submit', async e => {
        e.preventDefault();
        const params = new URLSearchParams({ q: q.value, k: k.value });
        if (category.value) params.set('category', category.value);
        const res = await fetch('/api/search?' + params);
        const matches = await res.json();
        results.replaceChildren(...(matches.length ? matches.map(m => {
            const div = document.createElement('div');
            div.className = 'result';
            const text = document.createElement('div');
            text.textContent = m.text;
            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.textContent = `score ${m.score.toFixed(3)} · ${m.category ?? 'no category'} · id ${m.id}`;
            div.append(text, meta);
            return div;
        }) : [Object.assign(document.createElement('p'), { textContent: 'No matches.' })]));
    });

    document.getElementById('add-form').addEventListener('submit', async e => {
        e.preventDefault();
        const res = await fetch('/api/documents', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text.value, category: document.getElementById('new-category').value || null })
        });
        const body = await res.json();
        document.getElementById('add-status').textContent = res.ok ? `Added with id ${body.id}` : 'Failed to add document';
        if (res.ok) text.value = '';
    });
</script>
</body>
</html>
