spring.application.name=vector-db-demo
server.port=8081

# Which vector store to use: "memory" (default, nothing to install) or "pgvector".
vector.store=memory
# Load src/main/resources/sample-docs.txt into the store at startup (skipped if the store already has data).
vector.seed-sample-data=true

# PostgreSQL + pgvector settings (only used when vector.store=pgvector)
vector.pgvector.host=localhost
vector.pgvector.port=5432
vector.pgvector.database=vectordb
vector.pgvector.user=vector
vector.pgvector.password=${PGVECTOR_PASSWORD:vector}
vector.pgvector.table=documents
